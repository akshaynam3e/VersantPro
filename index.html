    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

        body{
            min-height:100vh;
            background:black;
            color:white;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

        .title h1{

        .card{
            width:130px;
            height:130px;
            background:#111;
            color:white;
            border:2px solid white;
            border-radius:25px;
            font-size:16px;
            cursor:pointer;

            transition:all .3s ease;
        }

        /* Hovered button */
        .card:hover{
            transform:scale(1.08);
            box-shadow:0 0 20px white;
        }

        /* Blur all other buttons */
        .buttons:has(.card:hover) .card:not(:hover){
            filter:blur(2px);
            opacity:0.5;
            transform:scale(0.95);
        }
	.title h1{
    font-size:2.5rem;
    letter-spacing:3px;
}

.title h1 span{
    display:inline-block;
    color:white;
    transition:
        color 0.4s ease,
        transform 0.4s ease,
        text-shadow 0.4s ease;
    cursor:default;
}

.title h1 span:hover{
    color:cyan;
    transform:translateY(-5px);
    text-shadow:
        0 0 5px cyan,
        0 0 10px cyan,
        0 0 20px cyan;
}
	.title h1 span:hover{
    color:cyan;
    transform:translateY(-5px) scale(1.1);
    text-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 40px cyan;
}
	.card{
    width:130px;
    height:130px;

    background:#111;
    color:white;

    border:2px solid white;
    border-radius:25px;

    font-family:'Segoe UI', Arial, sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:1px;
    line-height:1.4;

    cursor:pointer;
    transition:all .3s ease;

    padding:10px;
    text-align:center;
}
.footer{
    position:fixed;
    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:15px;

    font-family:'Segoe UI',sans-serif;
    font-size:14px;
    letter-spacing:1px;
}

.footer a{
    color:white;
    text-decoration:none;

    transition:
        color .3s ease,
        transform .3s ease,
        text-shadow .3s ease;
}

.footer a:hover{
    color:cyan;

    transform:translateY(-2px);

    text-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 40px cyan;
}

.footer span{
    color:#555;
}
    .profile-btn{
    position:fixed;

    top:20px;
    right:20px;

    width:130px;
    height:50px;

    background:black;
    color:white;

    border:2px solid white;
    border-radius:12px;

    cursor:pointer;

    font-size:15px;
    font-weight:600;

    transition:.3s;

    z-index:9999;
}




@keyframes popupShow{

    from{

        opacity:0;
        transform:scale(.8);

    }

    to{

        opacity:1;
        transform:scale(1);

    }

}

@keyframes glow{

    from{

        box-shadow:
        0 0 10px rgba(0,255,255,.15);

    }

    to{

        box-shadow:
        0 0 25px rgba(0,255,255,.35);

    }

}

.profile-btn:hover{

    background:white;
    color:black;

    transform:scale(1.05);

    box-shadow:0 0 20px white;
}
