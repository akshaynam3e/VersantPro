<html>
<head>
<title>VersantPro - Fill In The Blanks</title>
<link rel="icon" type="image/png" href="icon.png">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:black;
    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:900px;
}

.section-title{
    position:fixed;
    top:20px;
    left:20px;

    font-size:32px;
    font-weight:bold;
    letter-spacing:8px;
}

.section-title:hover{
    color:cyan;
}

.back-btn{
    position:fixed;
    top:20px;
    right:20px;

    width:120px;
    height:45px;

    background:black;
    color:white;

    border:2px solid white;
    border-radius:12px;

    cursor:pointer;
}

.back-btn:hover{
    background:white;
    color:black;
}

#question{
    border:2px solid white;
    border-radius:20px;

    padding:30px;

    font-size:24px;
    text-align:center;
    line-height:1.6;

    transition:.4s;
}

#question:hover{
    transform:scale(1.05);
}

input{
    width:100%;
    height:60px;

    margin-top:25px;

    background:black;
    color:white;

    border:2px solid white;
    border-radius:15px;

    padding:15px;

    font-size:20px;
    text-align:center;
}

.buttons{
    margin-top:25px;

    display:flex;
    justify-content:center;
    gap:20px;
}

button{
    width:170px;
    height:55px;

    background:black;
    color:white;

    border:2px solid white;
    border-radius:12px;

    cursor:pointer;

    transition:.3s;
}

.buttons button:hover{
    background:white;
    color:black;
    transform:scale(1.05);
}

.buttons:has(button:hover) button:not(:hover){
    filter:blur(2px);
    opacity:.4;
}

#feedback{
    margin-top:25px;

    border:1px solid #444;
    border-radius:15px;

    padding:20px;
}

.score{
    font-size:32px;
    font-weight:bold;
}

</style>
</head>

<body>


<button
class="back-btn"
onclick="location.href='index.html'">
Back
</button>

<div class="container">

<div id="question">
Press Next To Start
</div>

<input
type="text"
id="answer"
placeholder="Type your answer">

<div class="buttons">

<button onclick="nextQuestion()">
Next
</button>

<button onclick="submitAnswer()">
Submit
</button>

</div>

<div id="feedback">
Waiting for response...
</div>

</div>

<script>

const blanks = [

{
question:"I don't know what I wrote. I'm going to rewrite ___ completely.",
answer:"it"
},

{
question:"He burned the oil and the fire left a black mark ___ the stove.",
answer:"above"
},

{
question:"When my bicycle got a flat tyre, I had ___ the train to work.",
answer:"to take"
},

{
question:"Because the company did not accept applications by mail, he had to submit his application using the company's ___.",
answer:"website"
},

{
question:"If you don't meet the height requirement, you are not allowed to get ___ the ride.",
answer:"on"
},

{
question:"He is running late. He should have been here an hour ___.",
answer:"ago"
},

{
question:"A good policy is to always respond to customer requests within 24 ___.",
answer:"hours"
},

{
question:"Workers who have previously completed training are exempted from the new training ___.",
answer:"requirement"
},

{
question:"Please make sure that all seatbelts are securely ___.",
answer:"fastened"
},

{
question:"If you want a hardworking employee, I highly recommend that you ___ him.",
answer:"hire"
},

{
question:"The residents were advised to evacuate their homes before the storm ___ them.",
answer:"reached"
},

{
question:"I have trouble sleeping at night, so I usually wake up very ___.",
answer:"tired"
},

{
question:"Over three hundred people witnessed the store's grand ___.",
answer:"opening"
},

{
question:"For more information about the product, please consult the instruction ___.",
answer:"manual"
},

{
question:"I went shopping yesterday and spent all my ___.",
answer:"savings"
},

{
question:"Don't forget to ask for a ___ when you pay.",
answer:"receipt"
},

{
question:"The bill wasn't right. I think they made a ___.",
answer:"mistake"
},

{
question:"Today is Tuesday. Yesterday was ___.",
answer:"Monday"
},

{
question:"I don't have my credit card. I must have left it at ___.",
answer:"home"
},

{
question:"When it rains, there are dark clouds in the ___.",
answer:"sky"
}

];

let currentQuestion;

function nextQuestion(){

    currentQuestion =
    blanks[Math.floor(
    Math.random()*blanks.length
    )];

    document.getElementById("question")
    .innerHTML =
    currentQuestion.question;

    document.getElementById("answer")
    .value = "";

    document.getElementById("feedback")
    .innerHTML =
    "Waiting for response...";
}

function submitAnswer(){

    const user =
    document.getElementById("answer")
    .value
    .trim()
    .toLowerCase();

    const correct =
    currentQuestion.answer
    .toLowerCase();

    const score =
    user === correct ? 10 : 0;

    document.getElementById(
    "feedback"
    ).innerHTML =

    `
    <div class="score">
        Score: ${score}/10
    </div>

    <br>

    <b>Your Answer:</b>
    ${user || "No Answer"}

    <br><br>

    <b>Correct Answer:</b>
    ${currentQuestion.answer}

    <br><br>

    ${
    score === 10
    ?
    "✅ Correct Answer"
    :
    "❌ Incorrect Answer"
    }
    `;
}

window.onload = function(){
    nextQuestion();
};

</script>

</body>
</html>
