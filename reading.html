<!DOCTYPE html>
<html>
<head>
<title>VersantPro - Repeat</title>
<link rel="icon" type="image/png" href="icon.png">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:30px;
}

.container{
    width:90%;
    max-width:900px;
}
#sentence{
    border:2px solid white;
    border-radius:20px;
    padding:30px;
    font-size:24px;
    text-align:center;
    line-height:1.6;

    transition:
        transform 0.5s ease,
        box-shadow 0.5s ease;
}

/* Increase size smoothly on hover */
#sentence:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(255,255,255,0.2);
}

.buttons{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

button{
    width:170px;
    height:55px;

    background:black;
    color:white;

    border:2px solid white;
    border-radius:12px;

    cursor:pointer;

    font-size:16px;
    font-weight:bold;

    transition:
        background .3s ease,
        color .3s ease,
        transform .3s ease,
        filter .3s ease,
        opacity .3s ease;
}

button:hover{
    background:white;
    color:black;
    transform:scale(1.05);
}

/* Blur remaining buttons */
.buttons:has(button:hover) button:not(:hover){
    filter:blur(2px);
    opacity:0.4;
    transform:scale(0.95);
}

#spoken{
    margin-top:25px;
    padding:20px;
    border:1px solid #444;
    border-radius:15px;
}

#feedback{
    margin-top:20px;
    padding:20px;
    border:1px solid #444;
    border-radius:15px;
}

.score{
    font-size:32px;
    font-weight:bold;
    margin-bottom:15px;
}

.good{
    color:#ffffff;
}

.bad{
    color:#cccccc;
}
.back-btn{
    position:fixed;
    top:20px;
    right:20px;

    width:120px;
    height:45px;

    background:black;
    color:white;

    border:2px solid white;
    border-radius:12px;

    cursor:pointer;

    font-size:15px;
    font-weight:bold;

    transition:all .3s ease;

    z-index:999;
}

.back-btn:hover{
    background:white;
    color:black;

    transform:scale(1.05);

    box-shadow:0 0 15px rgba(255,255,255,.3);
}
<div class="section-title">
    CONVERSATION
</div>

</style>
</head>

<body><button class="back-btn" onclick="location.href='index.html'">
    Back
</button>
<div class="container">

<div id="sentence">
Click Read Sentence
</div>

<div class="buttons">

<button onclick="generateSentence()">
Next
</button>

<button onclick="readSentence()">
Play Audio
</button>

<button onclick="startRecognition()">
Speak
</button>

</div>

<div id="spoken">
Your answer will appear here...
</div>

<div id="feedback">
Waiting for response...
</div>

</div>

<script>

const sentences = [
  "What time does the store open?",
  "Could you pass me the salt, please?",
  "Why did you leave your last job?",
  "How much does this cost?",
  "Where did you put my keys?",
  "Is this seat taken?",
  "Do you know what time it is?",
  "Have you finished your report yet?",
  "Can you recommend a good restaurant nearby?",
  "What is your opinion on this proposal?",
  "How often do you exercise?",
  "Did you sleep well last night?",
  "Who is responsible for this project?",
  "What should I bring to the interview?",
  "Have you met the new manager?",
  "Where can I find a parking spot?",
  "How do you like your new apartment?",
  "Could you explain that again, please?",
  "What is the deadline for this assignment?",
  "Do you prefer tea or coffee?",
  "How far is the airport from here?",
  "Have you booked your flight yet?",
  "What's the weather like today?",
  "Why is the printer not working?",
  "Can I borrow your pen for a moment?",
  "Do you know a good place to eat lunch?",
  "How long will the meeting last?",
  "Is there a discount for students?",
  "What time should we leave for the airport?",
  "Have you ever visited Japan?",
  "Could you send me the file by email?",
  "How was your weekend?",
  "Do you need any help with that?",
  "What kind of music do you like?",
  "Have you decided on a date for the wedding?",
  "Where should I sign this form?",
  "Can you turn down the volume, please?",
  "How many languages do you speak?",
  "Is the Wi-Fi password on the receipt?",
  "What do you think caused the delay?",
  "Have you tried the new coffee shop downtown?",
  "How did the presentation go?",
  "Do you have any questions about the policy?",
  "Where do you usually buy groceries?",
  "Could you double-check these numbers for me?",
  "How can I reset my password?",
  "Are you free this afternoon?",
  "What time does the train leave?",
  "Have you spoken to the client yet?",
  "Why does this always happen to me?",
  "Can you give me directions to the station?",
  "How much luggage am I allowed to bring?",
  "Do you want to join us for dinner?",
  "What's the fastest way to get downtown?",
  "Have you seen my glasses anywhere?",
  "Is this the correct form to fill out?",
  "How do I contact customer service?",
  "Could you repeat the question, please?",
  "What time does your shift start?",
  "Do you have any siblings?",
  "How long have you worked here?",
  "Have you read the terms and conditions?",
  "Where is the nearest pharmacy?",
  "Can you help me carry these boxes?",
  "What is included in the warranty?",
  "How do you plan to solve this issue?",
  "Do you mind if I open the window?",
  "Is the manager available right now?",
  "What was the outcome of the negotiation?",
  "Have you updated your resume recently?",
  "Where would you like to sit?",
  "Can I get a refund for this item?",
  "How was traffic on your way here?",
  "Do you know when the results will be announced?",
  "What time zone are you in?",
  "Have you completed the online training?",
  "Where can I charge my phone?",
  "Could you clarify the instructions?",
  "How do you usually spend your weekends?",
  "Is there an elevator in this building?",
  "What made you choose this career?",
  "Have you paid the electricity bill?",
  "Where should I park my car?",
  "Can you walk me through the process?",
  "How do I apply for this position?",
  "Do you accept credit cards here?",
  "What time is checkout at the hotel?",
  "Have you tried restarting the computer?",
  "Where did you go on your last vacation?",
  "Could you lower your voice a bit?",
  "How many people are coming to the party?",
  "Is this product available in other colors?",
  "What time does the store close on Sundays?",
  "Have you registered for the conference?",
  "Where do I submit my application?",
  "Can you check if the package has arrived?",
  "How do you feel about the new schedule?",
  "Is breakfast included in the room rate?",
  "What time should I arrive for the appointment?",
  "Have you considered working remotely?"
];



let currentSentence="";

generateSentence();

function generateSentence(){

    const random=Math.floor(
        Math.random()*sentences.length
    );

    currentSentence=sentences[random];

    document.getElementById("sentence")
    .innerHTML=currentSentence;

    document.getElementById("spoken")
    .innerHTML="Your answer will appear here...";

    document.getElementById("feedback")
    .innerHTML="Waiting for response...";
}

function readSentence(){

    let speech=
    new SpeechSynthesisUtterance(
        currentSentence
    );

    speech.lang="en-US";
    speech.rate=0.85;

    speechSynthesis.cancel();
    speechSynthesis.speak(speech);
}

function startRecognition(){

    if(!('webkitSpeechRecognition' in window)){

        alert(
            "Use Google Chrome for speech recognition."
        );

        return;
    }

    const recognition =
    new webkitSpeechRecognition();

    recognition.lang="en-US";
    recognition.interimResults=false;
    recognition.continuous=false;

    recognition.start();

    recognition.onresult=function(event){

        const spoken=
        event.results[0][0].transcript;

        document.getElementById("spoken")
        .innerHTML=
        "<b>You Said:</b><br><br>"+spoken;

        evaluate(spoken);
    };
}

function clean(text){

    return text
    .toLowerCase()
    .replace(/[.,!?]/g,'')
    .split(' ');
}

function evaluate(userSpeech){

    const original=
    clean(currentSentence);

    const user=
    clean(userSpeech);

    let missing=[];
    let correct=0;

    original.forEach(word=>{

        if(user.includes(word)){
            correct++;
        }else{
            missing.push(word);
        }

    });

    let accuracy=
    (correct/original.length)*10;

    accuracy=
    Math.round(accuracy*10)/10;

    let improvement=[];

    if(accuracy<5){

        improvement.push(
        "Try speaking slower."
        );

        improvement.push(
        "Listen carefully before answering."
        );

        improvement.push(
        "Repeat every word."
        );

    }

    else if(accuracy<8){

        improvement.push(
        "Avoid skipping words."
        );

        improvement.push(
        "Improve fluency and rhythm."
        );

    }

    else{

        improvement.push(
        "Excellent repetition."
        );

        improvement.push(
        "Work on natural pronunciation."
        );

    }

    document.getElementById("feedback")
    .innerHTML=

    `
    <div class="score">
    Score: ${accuracy}/10
    </div>

    <b>Missing Words:</b><br>
    ${
    missing.length
    ?
    missing.join(", ")
    :
    "None ✅"
    }

    <br><br>

    <b>Improvement Areas:</b>

    <ul style="margin-top:10px;">
    ${
    improvement.map(
    item=>`<li>${item}</li>`
    ).join("")
    }
    </ul>
    `;
}

</script>

</body>
</html>
