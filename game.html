<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Versant PRO | Typing Race</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:black;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    text-align:center;
}

.logo{
    margin-bottom:40px;
}

.logo h1{
    font-size:80px;
    letter-spacing:8px;
}

.logo h2{
    font-size:35px;
    font-weight:500;
}

.card{
    border:1px solid #444;
    border-radius:20px;
    padding:35px;
}

.card h3{
    margin-bottom:15px;
    font-size:28px;
}

.card p{
    color:#ccc;
    line-height:1.7;
    margin-bottom:30px;
}

.btn{
    width:100%;
    height:55px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    background:white;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.03);
}

.room-box{
    margin-top:25px;
}

.room-input{
    width:100%;
    height:55px;
    padding:0 15px;
    background:black;
    color:white;
    border:2px solid white;
    border-radius:12px;
    font-size:18px;
    text-align:center;
    margin-bottom:10px;
}

.status{
    margin-top:25px;
    color:cyan;
    font-size:17px;
}

.back-btn{
    position:fixed;
    top:20px;
    right:20px;

    width:120px;
    height:45px;

    border:2px solid white;
    border-radius:12px;

    background:black;
    color:white;

    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.3s;
}

.back-btn:hover{
    background:white;
    color:black;
}

.footer{
    margin-top:30px;
    color:#777;
    font-size:14px;
}

</style>
</head>

<body>

<a href="index.html" class="back-btn">
    Back
</a>

<div class="container">

    <div class="logo">
        <h1>V</h1>
        <h2>Versant PRO</h2>
    </div>

    <div class="card">

        <h3>🏁 Typing Race</h3>

        <p>
            Challenge real players in fast-paced typing races.
            Improve your speed, accuracy and reaction time while competing live.
        </p>

        <button class="btn" onclick="quickMatch()">
            ⚡ Quick Match
        </button>

        <button class="btn" onclick="createRoom()">
            🎮 Create Room
        </button>

        <div class="room-box">

            <input
                type="text"
                id="roomCode"
                class="room-input"
                placeholder="Enter Room Code"
            >

            <button class="btn" onclick="joinRoom()">
                🚪 Join Room
            </button>

        </div>

        <div class="status" id="status">
            Ready to race.
        </div>

        <div class="footer">
            Multiplayer Powered by Firebase
        </div>

    </div>

</div>

<script>

function quickMatch(){
    document.getElementById("status").innerHTML =
    "Searching for players...";
    
    // Firebase matchmaking code here
}

function createRoom(){

    let code = generateCode();

    document.getElementById("status").innerHTML =
    "Room Created: " + code;

    // Firebase create room code here
}

function joinRoom(){

    let code = document.getElementById("roomCode").value.trim();

    if(code === ""){
        alert("Enter room code");
        return;
    }

    document.getElementById("status").innerHTML =
    "Joining room " + code + "...";

    // Firebase join room code here
}

function generateCode(){

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i=0;i<5;i++){
        result += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    return result;
}

</script>

</body>
</html>
